name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tk + serveur X virtuel : la suite importe des fonctions pures de modules
      # GUI (gui_validation / gui_map), qui chargent customtkinter/tkinter.
      - name: Install Tk + Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: xvfb-run -a python -m pytest tests/ -q
